<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Agents</title>
<link rel="icon" type="image/png" href="/static/icons/logo-64.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <img src="/static/icons/logo-64.png" alt="" class="brand-mark" width="34" height="34">
      <div class="brand-text"><b>Domain Agents</b><small data-i18n="brand.tag">one engine · five sectors</small></div>
    </div>

    <div class="side-label" data-i18n="nav.agents">Agents</div>
    <nav id="agents" class="agent-list" aria-label="Agents"></nav>

    <div class="side-label" data-i18n="nav.project">Project</div>
    <nav class="proj-list">
      <a class="nav" data-view="checklist" href="#checklist">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.6 10.2l2.3 2.3 4.6-4.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span data-i18n="nav.checklist">Checklist &amp; spec</span></a>
      <a class="nav" data-view="docs" href="#docs">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M5 2.8h6.6L15.2 6.4v10.8H5z M11.4 2.8v3.8h3.8 M7.6 10.2h5 M7.6 13.2h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>
        <span data-i18n="nav.docs">Documentation</span></a>
    </nav>

    <div class="side-foot">
      <button id="openSettings" class="model-pill" type="button">
        <span id="keyDot" class="dot off"></span>
        <span class="mp-text"><b id="mpProvider">Gemini</b><small id="mpModel"></small></span>
        <svg class="mp-gear" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="lang-switch" role="group" aria-label="Interface language">
        <button type="button" data-ui-lang="en" lang="en">EN</button>
        <button type="button" data-ui-lang="ar" lang="ar">عربي</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <div id="head" class="top-inner"></div>
    </header>

    <section id="view-chat" class="view chat-view">
      <div class="chat-scroll" id="chatScroll">
        <div class="chat-col">
          <div id="info" class="info"></div>
          <div id="msgs" class="msgs" aria-live="polite"></div>
        </div>
      </div>
      <div class="composer-wrap">
        <div class="chat-col">
          <div id="memory" class="memory"></div>
          <div id="examples" class="chips" aria-label="Example questions"></div>
          <form id="form" class="composer">
            <textarea id="q" rows="1" dir="auto" data-i18n-ph="chat.placeholder" placeholder="Ask this agent a question…"></textarea>
            <div class="composer-bar">
              <label class="ctl"><span data-i18n="chat.answerIn">Answer in</span>
                <select id="lang">
                  <option value="auto" data-i18n="lang.auto">Auto</option>
                  <option value="en">English</option>
                  <option value="ar">العربية</option>
                </select>
              </label>
              <label class="switch" data-i18n-title="chat.reviewerTip" title="A second agent reviews each answer for safety">
                <input type="checkbox" id="review" checked><span class="sw" aria-hidden="true"></span><span data-i18n="chat.reviewer">Safety reviewer</span>
              </label>
              <button id="send" class="send" type="submit"><span data-i18n="chat.send">Send</span>
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5.5L15.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="view-checklist" class="view hidden"><div class="page"><div id="checklist"></div></div></section>
    <section id="view-docs" class="view hidden">
      <div class="docs-wrap">
        <nav id="docsNav" class="docs-nav"></nav>
        <article id="docBody" class="md" dir="ltr" lang="en"></article>
      </div>
    </section>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="setTitle" data-i18n="set.title">Model &amp; API key</h3>
      <button id="xSettings" class="icon-btn" type="button" aria-label="Close"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <p class="note" data-i18n="set.note">Your key stays in this browser tab only (sessionStorage) and is sent with each request. It is never saved on the server or in the repository.</p>

    <div class="field">
      <span class="f-label" data-i18n="set.provider">Provider</span>
      <div class="seg" id="providerSeg" role="radiogroup">
        <button type="button" role="radio" data-p="gemini">Google Gemini</button>
        <button type="button" role="radio" data-p="openai">OpenAI</button>
        <button type="button" role="radio" data-p="azure">Azure OpenAI</button>
      </div>
    </div>

    <label class="field"><span class="f-label" data-i18n="set.key">API key</span>
      <input id="apikey" type="password" autocomplete="off" spellcheck="false" dir="ltr" data-i18n-ph="set.keyPh" placeholder="Paste your key, or leave empty to use the server's .env">
    </label>

    <label class="field hidden" id="azureRow"><span class="f-label" data-i18n="set.endpoint">Azure endpoint</span>
      <input id="endpoint" placeholder="https://YOUR-RESOURCE.openai.azure.com" spellcheck="false" dir="ltr">
    </label>

    <div class="field">
      <div class="f-row"><label class="f-label" for="modelSel" data-i18n="set.model">Model</label>
        <button id="refreshModels" class="link-btn" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V6h-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="set.refresh">Refresh list</span></button></div>
      <div class="select-wrap"><select id="modelSel" dir="ltr"></select><span id="modelSpin" class="spin hidden" aria-hidden="true"></span></div>
      <input id="modelCustom" class="hidden" spellcheck="false" dir="ltr" data-i18n-ph="set.customPh" placeholder="Type a model or deployment name">
      <small id="modelStatus" class="f-hint"></small>
    </div>

    <div class="sheet-foot">
      <button id="testKey" type="button" class="btn ghost" data-i18n="set.test">Test connection</button>
      <span id="testOut" class="test-out"></span>
      <button id="closeSettings" type="button" class="btn primary" data-i18n="set.done">Done</button>
    </div>
  </div>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
