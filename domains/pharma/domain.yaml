use_case: >
  Helps pharmacists and clinicians look up drug-label information, drug–drug interactions and
  published evidence, and answers in a fixed, cited format.
tasks:
  - Summarise a drug's label (indications, contraindications, warnings)
  - Check interactions between two or more drugs and grade severity
  - Give evidence-backed context from PubMed abstracts
